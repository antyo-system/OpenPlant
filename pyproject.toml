[project]
name = "open-process-engine"
version = "0.1.0"
description = "Modular process calculation engine (mini Aspen kernel) with JSON flowsheets, solver, validator, and structured results."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.core",
  "app.db",
  "app.engine",
  "app.engine.units",
  "app.exporters",
  "app.schemas",
]
